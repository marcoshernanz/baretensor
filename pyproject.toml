[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baretensor"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.2",
    "torch>=2.10.0",
]

[dependency-groups]
dev = ["ipykernel", "nanobind", "ruff", "ty"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]
extend-exclude = ["third_party", "build"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python = ".venv"
python-version = "3.13"
root = ["./src", "."]

[tool.ty.src]
include = ["src", "tests", "experiments", "scripts"]
exclude = ["build", "third_party"]

[tool.ty.terminal]
error-on-warning = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["bt*"]

[tool.setuptools.package-data]
bt = ["py.typed", "*.pyi", "_C*.so", "_C*.dylib", "_C*.pyd"]
